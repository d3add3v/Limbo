<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limbo Keys - Final</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/d3add3v/Limbo/main/keys/key.png">

    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: #0a0015;
            font-family: Arial, sans-serif;
            color: #eee;
        }

        #backgroundVideo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            display: none;
        }

        .ending-background {
            background: #000 url('https://via.placeholder.com/1920x1080/111/222?text=Ending+BG') repeat-x;
            background-size: 100vh;
            animation: scrollBackground 120s linear infinite;
        }

        @keyframes scrollBackground {
            0%   { background-position: 0 0; }
            100% { background-position: -10000px 0; }
        }
    </style>
</head>
<body>

    <video id="backgroundVideo" muted loop playsinline>
        <source src="https://github.com/d3add3v/Limbo/raw/refs/heads/main/keys/audioandvideo/GameBG.mp4" type="video/mp4">
    </video>

    <audio id="limboAudio" preload="auto">
        <source src="https://github.com/d3add3v/Limbo/raw/refs/heads/main/keys/audioandvideo/limbo.mp3" type="audio/mpeg">
    </audio>

<script>
    const windows = [];
    let positions = [];
    let gridIDs = [];
    
    const gridSize = { rows: 4, cols: 2 };
    let windowSize = { width: 180, height: 210 };
    let spacing = { x: 210, y: 230 };
    
    const totalShuffleTime = 10500; 
    const difficulty = 40; 
    let shuffleDuration = (totalShuffleTime / difficulty) - 60; 

    const backgroundImage = 'https://raw.githubusercontent.com/d3add3v/Limbo/main/keys/key.png';
    const transitionDuration = 3200;
    let circleRadius = 280;
    let canClickWindows = false;

    window.addEventListener('beforeunload', closeAllWindows);

    const shufflePatterns = [
        {1:2, 2:1, 3:4, 4:3, 5:6, 6:5, 7:8, 8:7},
        {1:3, 2:4, 3:1, 4:2, 5:7, 6:8, 7:5, 8:6},
        {1:5, 2:6, 3:7, 4:8, 5:1, 6:2, 7:3, 8:4},
        {1:8, 2:7, 3:6, 4:5, 5:4, 6:3, 7:2, 8:1},
        {1:2, 2:3, 3:4, 4:1, 5:6, 6:7, 7:8, 8:5}
    ];

    function openWindows() {
        const sw = window.screen.availWidth;
        const sh = window.screen.availHeight;
        const totalGridW = (gridSize.cols - 1) * spacing.x + windowSize.width;
        const totalGridH = (gridSize.rows - 1) * spacing.y + windowSize.height;
        const startX = (sw - totalGridW) / 2;
        const startY = (sh - totalGridH) / 2;

        for (let i = 0; i < gridSize.rows * gridSize.cols; i++) {
            const col = i % gridSize.cols;
            const row = Math.floor(i / gridSize.cols);
            const x = startX + col * spacing.x;
            const y = startY + row * spacing.y;

            const win = window.open('', '_blank', `width=${windowSize.width},height=${windowSize.height},left=${Math.round(x)},top=${Math.round(y)},scrollbars=no`);
            if (!win) continue;

            win.document.write(`
            <!DOCTYPE html><html><head><title>Key</title></head>
            <body style="margin:0;overflow:hidden;background:#000;display:flex;justify-content:center;align-items:center;">
            <img src="${backgroundImage}" id="winImg" style="width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;" draggable="false">
            <script>
                window.addEventListener('click', () => window.opener.postMessage(window.correctWindow ? 'win' : 'lose', '*'));
            <\/script>
            </body></html>`);
            win.document.close();

            windows.push(win);
            gridIDs.push(i+1);
            positions.push({x, y});
            win.correctWindow = false;
        }
    }

    // Shuffling and Animation logic...
    function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

    function animateMove(win, from, to, duration, onComplete) {
        if (win.closed) return;
        const startTime = performance.now();
        function step(now) {
            const elapsed = now - startTime;
            const t = Math.min(elapsed / duration, 1);
            const eased = easeInOutQuad(t);
            win.moveTo(Math.round(from.x + (to.x - from.x) * eased), Math.round(from.y + (to.y - from.y) * eased));
            if (t < 1) requestAnimationFrame(step);
            else if (onComplete) onComplete();
        }
        requestAnimationFrame(step);
    }

    function shuffle() {
        let index = 0;
        function doOneShuffle() {
            if (index >= difficulty) {
                setTimeout(() => { positionWindowsInCircle(); canClickWindows = true; }, 400);
                return;
            }
            const pat = shufflePatterns[Math.floor(Math.random() * shufflePatterns.length)];
            const newPos = []; const newIDs = Array(gridIDs.length);
            for (const fr in pat) {
                const to = pat[fr];
                const fi = gridIDs.indexOf(parseInt(fr)); const ti = gridIDs.indexOf(parseInt(to));
                if (fi !== -1 && ti !== -1) { newPos[fi] = positions[ti]; newIDs[fi] = gridIDs[ti]; }
            }
            let completed = 0;
            for (let i = 0; i < windows.length; i++) {
                animateMove(windows[i], positions[i], newPos[i], shuffleDuration, () => {
                    completed++;
                    if (completed === windows.length) { positions = [...newPos]; gridIDs = [...newIDs]; index++; setTimeout(doOneShuffle, 30); }
                });
            }
        }
        doOneShuffle();
    }

    function positionWindowsInCircle() {
        const angleStep = 2 * Math.PI / windows.length;
        const cx = window.screen.availWidth / 2; const cy = window.screen.availHeight / 2;
        let startTime = performance.now();
        function step(now) {
            const elapsed = now - startTime;
            const t = Math.min(elapsed / transitionDuration, 1);
            const eased = easeInOutQuad(t);
            windows.forEach((win, i) => {
                const ang = (gridIDs[i] - 1) * angleStep;
                const tx = cx + circleRadius * Math.cos(ang) - windowSize.width / 2;
                const ty = cy + circleRadius * Math.sin(ang) - windowSize.height / 2;
                win.moveTo(Math.round(positions[i].x + (tx - positions[i].x) * eased), Math.round(positions[i].y + (ty - positions[i].y) * eased));
            });
            if (t < 1) requestAnimationFrame(step); else spinCircle();
        }
        requestAnimationFrame(step);
    }

    function spinCircle() {
        let angle = 0; let speed = 0;
        const cx = window.screen.availWidth / 2; const cy = window.screen.availHeight / 2;
        function step() {
            angle += speed;
            const radOffset = angle * Math.PI / 180;
            windows.forEach((win, i) => {
                const ang = (gridIDs[i] - 1) * (2 * Math.PI / windows.length) + radOffset;
                win.moveTo(Math.round(cx + circleRadius * Math.cos(ang) - windowSize.width / 2), Math.round(cy + circleRadius * Math.sin(ang) - windowSize.height / 2));
            });
            speed = Math.min(1.35, speed + 0.038);
            requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    function flashCorrectKeyImage() {
        const idx = Math.floor(Math.random() * windows.length);
        const win = windows[idx];
        const img = win.document.getElementById('winImg');
        img.src = 'https://raw.githubusercontent.com/d3add3v/Limbo/main/keys/green-key.png';
        setTimeout(() => { img.src = backgroundImage; }, 1100);
        win.correctWindow = true;
    }

    // RESULTS & CLEANUP
    window.addEventListener('message', (e) => {
        if (e.data !== 'win' && e.data !== 'lose') return;
        closeAllWindows(); // Delete all popups
        showResultScreen(e.data);
    });

    function showResultScreen(status) {
        const div = document.createElement('div');
        div.style.cssText = `position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.9); color:white; transition: opacity 0.5s;`;
        
        const txt = document.createElement('div');
        txt.textContent = status === 'win' ? 'CORRECT' : 'WRONG';
        txt.style.fontSize = '6rem';
        txt.style.color = status === 'win' ? '#0f3' : '#f03';

        const btn = document.createElement('button');
        btn.textContent = 'Restart';
        btn.style.cssText = `margin-top:40px; padding:15px 40px; font-size:1.5rem; cursor:pointer;`;
        btn.onclick = () => location.reload();

        div.appendChild(txt);
        div.appendChild(btn);
        document.body.appendChild(div);
        flashScreen(status === 'win' ? '#0a3' : '#a00');
    }

    function flashScreen(color) {
        document.body.classList.add('ending-background');
        const f = document.createElement('div');
        f.style.cssText = `position:fixed;inset:0;z-index:10000;background:${color};opacity:0.8;pointer-events:none;`;
        document.body.appendChild(f);
        setTimeout(() => f.style.opacity = '0', 300);
    }

    function closeAllWindows() { windows.forEach(w => { if (!w.closed) w.close(); }); }

    function startGame() {
        document.getElementById('backgroundVideo').style.display = 'block';
        const audio = document.getElementById('limboAudio');
        audio.currentTime = 180;
        audio.play().catch(() => {});
        openWindows();
        flashCorrectKeyImage();
        setTimeout(shuffle, 1200);
    }

    startGame();
</script>
</body>
</html>
